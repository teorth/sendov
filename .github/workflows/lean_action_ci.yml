name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1

      # The repository's trust policy, enforced: no `sorry` outside the two
      # deliberate holes in Challenge.lean, no project-defined axiom, no
      # native_decide, no unsafe, no floating point, and the top-level results
      # depending on the three standard axioms only.  See docs/design.md.
      - name: Trust audit
        run: bash scripts/audit.sh
