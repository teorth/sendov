# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: v0.4
project:
  name: Sendov's conjecture and the Phelps-Rodriguez conjecture
  description: 'Local Lean development of both complete conjectures, retaining the original polynomial,
    analytic and boundary arguments and replacing the old scalar endgame by a proved cubic polar envelope
    and full-degree-ray alpha estimates. Degrees 2 through 5 use the unchanged elementary analytic proof.
    For every real m >= 5, 0 < alpha <= 17, 2*alpha <= m, the original scalar is strictly below one.
    The natural n >= 6 wrapper and final statements are unchanged. No finite degree certificates,
    numerical degree bases or old interval/tail cutoff remain; no bound is assumed.'
  authors:
  - Terence Tao
  license: Apache-2.0
repository:
  role: substantive-development
classification:
  arxiv:
  - math.CV
  msc2020:
  - 30C15
  - 30C10
  - 12D10
status:
  scope: 'Complete, with no unproved step. Both conjectures in full generality: every complex polynomial
    of degree at least two with all zeroes in the closed unit disk, and every zero of it. No restriction
    on the degree beyond n >= 2, on the modulus or argument of the distinguished zero, or on multiplicities.
    Nothing is assumed from the literature; the two compared theorems are proved from Mathlib alone.'
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
  - propext
  - Classical.choice
  - Quot.sound
  main_results:
  - declaration: SendovConjecture.sendov
    file: Solution.lean
    sorry_count: 0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
    comparator_config: comparator.json
    literature_dependencies: []
  - declaration: SendovConjecture.phelps_rodriguez
    file: Solution.lean
    sorry_count: 0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
    comparator_config: comparator.json
    literature_dependencies: []
fidelity:
  divergences: The original final theorem types and polynomial semantics are unchanged. The local
    variant uses Senjian An's stronger rational polar envelope and two-chord estimate, followed by
    small, middle and large alpha bounds on full real-degree rays. Fixed alpha identities of degrees
    53, 47 and 47 have complete kernel-checked coefficients and factors. The raw scalar at alpha zero
    is not silently redefined by regularization. The degree-five case now uses the existing elementary
    low-degree theorem, unchanged in this stage. Obsolete intermediate interfaces are retired, not
    maintained as a second proof system. No claim that m=5 is globally minimal is made.
sources:
- title: A digestion of the proof of Sendov's conjecture
  authors:
  - Terence Tao
  type: web post
  id: https://terrytao.wordpress.com/2026/08/12/a-digestion-of-the-proof-of-sendovs-conjecture/
  relationship: formalizes
  note: Source of the retained polynomial, analytic and boundary reduction. The scalar endgame in
    this local variant is replaced by the separately listed distillation method; the full conjecture
    statements are preserved.
- title: Research Problems in Function Theory (statement of Sendov's conjecture)
  authors:
  - W. K. Hayman
  type: book
  id: https://zbmath.org/3254142
  relationship: background
  note: Where the conjecture, due to Blagovest Sendov, was first recorded as a research problem. Used
    to fix the standard statement that Challenge.lean is checked against.
- title: Some properties of extremal polynomials for the Ilieff conjecture
  authors:
  - D. Phelps
  - R. S. Rodriguez
  type: article
  id: https://zbmath.org/3386011
  relationship: formalizes
  note: 'The source of the strengthened conjecture with the equality classification, formalized here
    as SendovConjecture.phelps_rodriguez. Two sources carry "formalizes", and they supply different
    things: the blog post supplies the proof that this development follows, and this paper supplies
    the statement of the stronger of the two theorems proved. The submitted statement does not extend
    the conjecture recorded here -- it is proved exactly as stated -- which is why this is "formalizes"
    rather than "adapts".'
- title: On a problem of Ilyeff
  authors:
  - Z. Rubinstein
  type: article
  location: Pacific J. Math. 26 (1968), 159-161
  relationship: background
  note: 'The boundary case |a| = 1, with the same equality classification. This development proves
    that case from scratch in Sendov/Boundary.lean, from p''''(1)/p''(1), following the blog post
    rather than transcribing Rubinstein''s paper, on which it does not depend. The argument used is
    not new either: see the Tang-Zhang entry below.'
- title: Sharp Schoenberg type inequalities and the de Bruin-Sharma problem
  authors:
  - Quanyu Tang
  - Teng Zhang
  type: preprint
  id: arXiv:2508.10341
  location: Equation (5.1) and Remark 5.1
  relationship: background
  note: 'Equation (5.1) and Remark 5.1 of this preprint are the two ingredients of the boundary case
    |a| = 1 in Sendov/Boundary.lean: their identity sum_k 1/w_k = 2 sum_j 1/z_j is Sendov.boundary_reciprocal
    after moving the distinguished zero from 0 to 1, and their Re(1/z_j) <= -1/2 is Sendov.half_le_re_inv_one_sub.
    Remark 5.1 combines them to give the a = 1 case of Sendov''s conjecture in the non-strict form
    min_k |w_k| <= 1. This development reaches the same two ingredients from the blog post rather
    than from this preprint, and goes one step further, extracting equality term by term to obtain
    the classification p = c(z^n - a^n); that step recovers Rubinstein''s 1968 theorem and is likewise
    not claimed as new. The correspondence was checked against the preprint after the formalization
    was complete.'
- title: On a conjecture of Ilieff
  authors:
  - D. A. Brannan
  type: article
  location: Proc. Cambridge Philos. Soc. 64 (1968), 83-85
  relationship: background
  note: The cubic case, which falls out of the low-degree branch here. No comparison with Brannan's
    argument was made.
- title: On Ilyeff's conjecture
  authors:
  - A. Meir
  - A. Sharma
  type: article
  location: Pacific J. Math. 31 (1969), 459-467
  relationship: background
  note: Degree five, and the reciprocal identities of which the boundary identity used here is the
    k = nu = 1 specialization.
- title: Sendov's conjecture for sufficiently high degree polynomials
  authors:
  - Terence Tao
  type: article
  id: https://zbmath.org/7681950
  relationship: background
  note: The earlier high-degree result. Its use of analytic continuation is what the digested argument
    replaces by explicit scalar estimates. This variant closes the scalar domain without degree rows.
- title: Sendov conjecture proof (ProofAtlas manuscript)
  authors:
  - Lech Mazur
  type: other
  id: https://www.proofatlas.ai/papers/sendov-conjecture/
  relationship: adapts
  note: The first complete proof of Sendov's conjecture for all n >= 2, produced with an AI tool.
    The blog post above is a digestion and simplification of this argument, so the mathematics formalized
    here descends from it; the extension to the Phelps-Rodriguez form is what "adapts" records. The
    adaptation reached this repository through the blog post; this manuscript was not worked from
    directly. The corresponding Lean work is recorded under related_formalizations.
- title: Proof Distillation for Sendov's Conjecture
  authors:
  - Senjian An
  type: other
  id: https://github.com/SJanPerth/Sendov-Proof-Distillation/tree/e8ae601491ec171ab4f7f8456113dd6a047aa85d
  relationship: adapts
  note: Source of the retained cubic rational envelope and two-chord estimate. The source paper is
    CC BY 4.0. Its finite degree certificates and degree tail are superseded by the full-ray alpha
    estimates; no Python verification is a trusted premise.
related_formalizations:
- id: https://www.proofatlas.ai/formalizations/sendov-conjecture/
  relationship: builds-on
  note: 'The earlier Lean formalization of Sendov''s conjecture for all n >= 2, by Lech Mazur, reported
    there as 1160 files and 92816 lines with a single main theorem. Priority for the first machine-checked
    proof of Sendov''s conjecture belongs to that work, and this repository is the second formalization
    of it. "builds-on" rather than "independent": no code is shared and that development was never
    read, but the informal proof formalized here is a digestion of its argument, so the mathematics
    descends from it. What is additional here is the Phelps-Rodriguez equality classification, which
    that formalization does not state; as far as we are aware this is its first formalization, but
    that is an observation about the one earlier formalization we know of and not the result of a
    search. The two developments are separately checkable evidence for the same theorem; no comparison
    of their internal arguments has been carried out.'
automation:
  methods:
  - method: agent
    framework: Hermes Agent
    role: Local implementation, independent agent source reviews, and executable verification of this
      adaptation. This is not an assertion of new upstream-maintainer or human peer review.
  - method: other
    framework: Python exact arithmetic
    role: scripts/gen_sinh.py reproduces the retained global hyperbolic proof source. The alpha
      identities are self-contained Lean source and require no generator. Python tests exercise
      full-identity mutations and audit failures; compiler and kernel acceptance are separate.
review:
  status: self-assessed
  notes: The no-degree-row full-real-m5 candidate is subject to exact-source compilation, kernel replay,
    original compiled-contract comparison and full unpruned proof-value audits. Parent review of the
    final exact tree, promotion and paired milestone measurements remain separate pending gates.
    This is not a claim of human peer review or upstream-author endorsement.
known_gaps: []
limitations:
- The two deliberate placeholders in Challenge.lean are specifications, not imported proof premises.
- Independent kernel replay is over the fixed imported environment; it is not a fresh re-proof of
  Mathlib.
- Timing evidence belongs to its stated source trees and resource configuration, not a claim of exclusive-machine
  performance.
alignment:
  namespace: Sendov
  statements:
  - source: Sendov's conjecture
    lean: SendovConjecture.sendov
    module: Solution
    status: proved
    note: Complete original evaluation-based statement for every polynomial of degree at least two
      and every zero.
  - source: Phelps-Rodriguez equality classification
    lean: SendovConjecture.phelps_rodriguez
    module: Solution
    status: proved
    note: Complete original strict-distance alternative or the unit-circle nonzero scalar-multiple
      form.
  - source: Original polar/origin reduction with a cubic envelope
    lean: Sendov.cubicScalar_constraints_of_polar_origin
    module: Sendov.Reduction.CubicScalar
    status: proved
    note: Derives all scalar-domain conditions and the lower bound from the original geometric inputs.
  - source: Complete original scalar domain on real degree rays
    lean: Sendov.distillScalar_lt_one_real
    module: Sendov.Common.DistillationBounds
    status: proved
    note: Every real m >= 5, 0 < alpha <= 17, 2*alpha <= m; no degree base or finite row.
