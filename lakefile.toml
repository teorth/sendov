name = "sendov"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Sendov", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[lean_lib]]
name = "Sendov"
globs = ["Sendov", "Sendov.+"]

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
